<head>

    <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
    <style>
        body {
            background: rgb(165, 219, 253);
            color: rgb(168, 33, 230);
            font-family: 'Courier New', Courier, monospace;
        }

        h1 {
            font-family: 'Times New Roman', Times, serif;
        }

        h2 {
            color: #005b00;
        }

        .bob {
            color: yellow;
        }

        #tom {
            color: rgb(255, 166, 0);
        }

        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        ul li a {
            color: rgb(172, 0, 252);
            text-decoration: none;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 50px;
            margin: 10px;
            border: 2px solid orange;
            border-radius: 10px;
            box-shadow: -5px 5px 0px rgba(0, 0, 0, 0.222);
            transition: scale .6s, box-shadow .6s, background .6s, color .6s;
        }

        ul li a:hover {
            background: rgb(255, 255, 61);
            color: rgb(157, 0, 255);
            box-shadow: 5px 15px 10px rgba(0, 0, 0, 0.609);
            scale: 1.2;
        }
    </style>
</head>

<body>
