<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>my index page</title>
    <style>
    div{
        width: 300px;
        height: 300px;
        background:rgb(190, 155, 255);
        margin: 50px; 
    }
    #static{
        background: rgb(193, 141, 244);
        position: static; /*default position*/
    }
    #sticky{
        background:rgb(163, 74, 246);
        position: sticky; /*static until hits edge*/

    }
    #relative{
        background: rgb(129, 18, 240);
        position: relative; /*moves box but leaves hole*/
        left: 100px;
        top: -100px;
        z-index: -10;
    }
    #fixed{
        background:rgb(82, 6, 144);
        position: fixed; /*stuck to screen, leaves no hole*/
        top: 50px;
        right:560px;
    }
    #absolute{
        background:rgb(63, 8, 98);
        position: absolute; /*stuck to content, no hole*/
        right: 30px;
        bottom: 50px;
    }
    </style>

</head>

<body>
<div id="static"></div>
<div id="sticky"></div>
<div id="relative"></div>
<div id="fixed"></div>
<div id="absolute"></div>

</body>


</html>
